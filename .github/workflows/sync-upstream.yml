name: 同步作者更新

on:
  schedule:
    - cron: "0 12 * * *" # 每天北京时间 20:00 检查一次
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
    steps:
      - name: 检出我的仓库
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 拉取作者最新代码（保留我自己的 .github 目录）
        run: |
          git remote add upstream https://github.com/wenyuanw/a-share-heatmap.git
          git fetch upstream main
          git reset --hard upstream/main
          rm -rf .github
          git checkout origin/main -- .github

      - name: 重新应用我的修改
        run: node .github/scripts/apply-patches.mjs

      - name: 有变化才推送
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "同步作者更新并应用本地修改" || true
          if git diff --quiet origin/main HEAD; then
            echo "和上次同步相比没有变化，跳过推送"
            exit 0
          fi
          git push origin HEAD:main --force
          echo "pushed=true" >> "$GITHUB_OUTPUT"

  # 用 GITHUB_TOKEN 推送不会触发其他工作流，所以在这里显式调用部署
  deploy:
    needs: sync
    if: needs.sync.outputs.pushed == 'true'
    uses: ./.github/workflows/deploy-jdcloud.yml
    secrets: inherit
